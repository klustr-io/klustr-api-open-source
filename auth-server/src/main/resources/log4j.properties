# Root logger option
log4j.rootLogger=INFO, stdout
log4j.appender.stdout=org.apache.log4j.ConsoleAppender
log4j.appender.stdout.Target=System.out
log4j.appender.stdout.layout=org.apache.log4j.PatternLayout
log4j.appender.stdout.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} %-5p %c:%L - %m%n

# Suppress Kafka INFO logs
log4j.logger.org.apache.kafka=WARN

# Suppress Spring Security INFO/WARN logs
log4j.logger.org.springframework.security=WARN

# Suppress specific security warnings about ignoring Mvc patterns
log4j.logger.org.springframework.security.config.annotation.web.builders.WebSecurity=ERROR
log4j.logger.org.springframework.security.web.DefaultSecurityFilterChain=ERROR
