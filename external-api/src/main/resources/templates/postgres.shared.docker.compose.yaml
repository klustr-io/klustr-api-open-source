
version: "3.8"

services:
  postgres-pool:
    image: postgres:latest
    container_name: postgres-pool-${NODE_ID}
    restart: always
    ports:
      - "5432"
    deploy:
      resources:
        limits:
          cpus: "${CPU_LIMIT:-1.0}"
          memory: "${MEMORY_LIMIT:-512M}"
        reservations:
          cpus: "${CPU_RESERVE:-0.25}"
          memory: "${MEMORY_RESERVE:-128M}"
    environment:
      ORG_ID: "klustr.io"
      PROJECT_ID: "postgres-pool"
      MACHINE_TYPE: ${MACHINE_TYPE}
      SERVER_DOMAIN: "postgres-pool-${NODE_ID}.dev.klustr.io"
      # pg specific
      POSTGRES_DB: "shared"
      POSTGRES_USER: "admin"
      POSTGRES_PASSWORD: "admin"
      PGDATA: /data/postgres
      PGPORT: 5432
      POSTGRES_SCHEMA: public
    labels:
      namespace: "postgres-pool"
      org_id: "klustr.io"
      project: "postgres-pool"
      project_id: "postgres-pool"
      type: "TENANT"
      machine_type: "${MACHINE_TYPE}"
      workload: "postgres"
      endpoint: "postgres-pool-${NODE_ID}.dev.klustr.io"
      # Traefik labels for automatic PostgreSQL routing
      traefik.enable: true
      traefik.tcp.routers.postgres-pool-${NODE_ID}.rule: HostSNI(`postgres-pool-${NODE_ID}.dev.klustr.io`)
      traefik.tcp.routers.postgres-pool-${NODE_ID}.entrypoints: postgres
      traefik.tcp.routers.postgres-pool-${NODE_ID}.tls.passthrough: true
      traefik.tcp.routers.postgres-pool-${NODE_ID}.service: postgres-pool-${NODE_ID}
      traefik.tcp.services.postgres-pool-${NODE_ID}.loadbalancer.server.port: 5432
    volumes:
      - postgre_data:/data/postgres
      - /code/data-platform/docker/postgres/postgres-initdb:/docker-entrypoint-initdb.d/
      - /code/data-platform/certs/dev.klustr.io/certbot/fullchain.pem:/certs/fullchain.pem:ro
      - /code/data-platform/certs/dev.klustr.io/certbot/privkey.pem:/certs/privkey.pem:ro
    networks:
      - ingress
    dns:
      - ${DNS_HOST}
    command: >
      bash -c "
      cp /certs/fullchain.pem /tmp/server.crt &&
      cp /certs/privkey.pem /tmp/server.key &&
      chown postgres:postgres /tmp/server.key &&
      chown postgres:postgres /tmp/server.crt &&
      chmod 600 /tmp/server.key &&
      chmod 644 /tmp/server.crt &&
      exec docker-entrypoint.sh postgres
      -c ssl=on
      -c ssl_cert_file=/tmp/server.crt
      -c ssl_key_file=/tmp/server.key
      -c ssl_min_protocol_version=TLSv1.2
      "

  postgres-pool-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    container_name: postgres-pool-${NODE_ID}-metrics
    restart: always
    environment:
      DATA_SOURCE_NAME: "postgresql://admin:admin@postgres-pool-${NODE_ID}:5432/shared?sslmode=require"
    labels:
      namespace: "postgres-pool"
      org_id: "klustr.io"
      project: "postgres-pool"
      project_id: "postgres-pool"
      type: "TENANT"
      workload: "postgres-exporter"
      machine_type: "${MACHINE_TYPE}"
    ports:
      - "9187"
    networks:
      - ingress
#    depends_on:
#      - postgres-pool-${NODE_ID}
    dns:
      - ${DNS_HOST}

volumes:
  postgre_data:
    name: "postgres-pool-${NODE_ID}"

networks:
  ingress:
    external: true