    oAuth2ConsentRequestOpenIDConnectContext:
      example:
        login_hint: login_hint
        ui_locales:
          - ui_locales
          - ui_locales
        id_token_hint_claims:
          key: ""
        acr_values:
          - acr_values
          - acr_values
