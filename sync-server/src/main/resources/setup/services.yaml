# -- Events API
- id: "events-api"
  name: "Events API"
  summary: "Enable your application to record events such as exposure to experiments."
  org_id: "klustr.io"
  icon: "https://cdn.dev.klustr.io/klustr/gcs/send.png"
  url: "https://api.dev.klustr.io/events"
  open_api_url: "https://api.dev.klustr.io/v3/api-docs.yaml/events"
  status: general_availability
  consent_scopes:
    - "profile"
  routes:
    - hosts:
        - "gateway.dev.klustr.io"
      paths:
        - "/events"
  tags:
    - "analytics"
    - "data-platform"

