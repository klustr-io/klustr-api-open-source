# -- EKYC
- id: "ekyc-api"
  name: "eKYC Verification API"
  summary: "Enables your applications to participate in eKYC flows to verify the user\
    \ identity through face and document verification processes."
  org_id: "klustr.io"
  icon: "https://cdn.dev.klustr.io/klustr/gcs/fingerprints.png"
  url: "https://api.dev.klustr.io/ekyc"
